# WorklogCanvas.exe を作り、GitHub の Release に添付する。
#
# - v1.2.0 のようなタグをプッシュ → テスト・exe の作成・動作確認のあと、
#   WorklogCanvas-v1.2.0-windows.zip を添付した Release を作る（リリースノートは自動生成）
# - GitHub の Releases 画面で Release を作った（公開した）とき → 同じ手順で作った zip をその Release に添付する
# - プルリクエスト・手動実行 → 同じ手順でビルドを確かめるだけ（Release は作らない。zip は成果物として7日間保存）
# ※ タグを付けるコミットに、このファイル（.github/workflows/release.yml）が入っている必要がある
#
# 使い方（どちらか）:
#   git tag v1.2.0 && git push origin v1.2.0
#   GitHub の「Releases」→「Draft a new release」→ タグ v1.2.0 を main に作って「Publish release」
name: Release

on:
  push:
    tags: ["v*.*.*"]
  release:
    types: [published]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # Release の作成に必要

# 画面からの Release 作成では「タグのプッシュ」と「Release の公開」の両方で起動しうるので、
# 同じタグの実行は順番に行い、後の実行は添付済みなら何もしない
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 版番号を決める
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::タグは v1.2.3 の形にしてください（$tag）"
              exit 1
            fi
            echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
            echo "name=$tag" >> "$GITHUB_OUTPUT"
          else
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "name=build-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: 添付済みか確かめる（タグのとき）
        id: done
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip="WorklogCanvas-${{ steps.ver.outputs.name }}-windows.zip"
          if gh release view "${{ steps.ver.outputs.name }}" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx "$zip"; then
            echo "$zip は添付済みのため、何もしません"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: ライブラリを入れる
        if: steps.done.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: 自動テスト
        if: steps.done.outputs.skip != 'true'
        timeout-minutes: 15
        run: python -m pytest -q

      - name: exe の作成と動作確認
        if: steps.done.outputs.skip != 'true'
        timeout-minutes: 15
        shell: bash
        run: |
          args=(--zip "out/WorklogCanvas-${{ steps.ver.outputs.name }}-windows.zip")
          if [[ -n "${{ steps.ver.outputs.version }}" ]]; then
            args+=(--version "${{ steps.ver.outputs.version }}")
          fi
          python packaging/build_exe.py "${args[@]}"

      - name: 成果物として保存（プルリクエスト・手動実行）
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: WorklogCanvas-${{ steps.ver.outputs.name }}-windows
          path: out/*.zip
          retention-days: 7

      - name: Release を作る、または既存の Release に添付する（タグのとき）
        if: github.ref_type == 'tag' && steps.done.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.ver.outputs.name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" out/*.zip --clobber
          else
            gh release create "$tag" out/*.zip \
              --title "Worklog Canvas $tag" \
              --generate-notes \
              --verify-tag
          fi
